[package]
name = "motionbench-py"
description = "Python bindings for motionbench-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
motionbench-core = { path = "../crates/motionbench-core" }
serde_json.workspace = true
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
