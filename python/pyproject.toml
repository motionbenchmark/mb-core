[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "motionbench"
description = "Open benchmark for goal-directed robots in confined spaces: score any run against human references"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "MotionBench contributors" }]
keywords = ["robotics", "benchmark", "vex", "evaluation", "robot-vacuum"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.22"]
dynamic = ["version"]

[project.optional-dependencies]
tracker = ["opencv-contrib-python-headless>=4.7"]
mcp = ["mcp>=1.2", "httpx>=0.25"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://motionbench.org"
Repository = "https://github.com/motionbenchmark/mb-core"

[project.scripts]
motionbench = "motionbench.cli:main"
motionbench-mcp = "motionbench.mcp_server:main"

[tool.maturin]
module-name = "motionbench._core"
python-source = "."
features = ["pyo3/extension-module"]
